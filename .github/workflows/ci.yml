name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Syntax of the dashboard scripts
        run: node --check dashboard/model.js && node --check dashboard/app.js
      - name: Tests (skipped without the kit's sealed snapshot)
        run: npm test
