name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Conventions (npm run lint)
        run: npm run lint
      - name: Syntax of the dashboard scripts
        run: node --check dashboard/model.js && node --check dashboard/plan.js && node --check dashboard/app.js

  verify:
    runs-on: ubuntu-latest
    needs: conventions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # CI only: the sealed snapshot is the bounty kit's input and is not committed.
      - name: Fetch the sealed snapshot from the bounty kit
        run: |
          curl -sSfL "https://make.fun/c/token-radar-01/kit" | tar xz token-radar-01-kit/input
          ln -s token-radar-01-kit/input input
      - name: Tests, browser included, with the 100% coverage gate
        run: npm test
      - name: Two runs, every byte compared
        run: npm run verify
      - name: The dossier is whole and fits the judge's text budget
        run: |
          mkdir -p out && node main.ts --input input/snapshot.json --output out
          node -e "const t=JSON.parse(require('fs').readFileSync('out/dossier.json','utf8')).text; const n=Buffer.byteLength(t); console.log('dossier text bytes',n); if(n>65536||!t.includes('g.RadarModel')||!t.includes('g.RadarPlan = {')) process.exit(1)"
